<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Exercise 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    padding: 1rem;
    background-color: #f5f5f5;
}

.container {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

header, footer {
    padding: 1.5rem;
    text-align: center;
    color: white;
    border-radius: 0.5rem;
    font-weight: bold;
}

header {
    background-color: #1e90ff;
    box-shadow: 0 4px 0 #0077ea;
}

footer {
    background-color: #4169e1;
    box-shadow: 0 4px 0 #1444b8;
}

.content {
    display: flex;
    gap: 1rem;
}

main {
    flex: 3;
    background-color: #3cb371;
    border-radius: 0.5rem;
    padding: 1rem;
    box-shadow: 0 4px 0 #2f8d59;
}

.item-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1rem;
}

.item {
    flex: 1 0 calc(25% - 1rem);
    background-color: #2f8d59;
    border-radius: 0.5rem;
    padding: 1.5rem;
    text-align: center;
    color: white;
    box-shadow: 0 4px 0 #226741;
}

.sidebar {
    flex: 1;
    background-color: #ff6347;
    border-radius: 0.5rem;
    padding: 1rem;
    text-align: center;
    color: white;
    box-shadow: 0 4px 0 #e02200;
    font-weight: bold;
}





       
    </style>
    <div class="container">
        <header>Header</header>
        <div class="content">
            <main>
                Main
                <div class="item-grid">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </main>
            <div class="sidebar">Sidebar</div>
        </div>
        <footer>Footer</footer>
    </div>
</body>
</html>
