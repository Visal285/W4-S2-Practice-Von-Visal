<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body{
            margin: 0;
            height: 100vh;
            padding-left: 3em;
            padding-right: 3em;
            background: #25384B;
            display: flex;
        }
        .main{
            display: flex;
            flex-grow: 1;
            padding-left: 3em;
            padding-right: 3em;
            gap : 6em;

        }
        .left-section {
        flex-grow: 2;
        background: #A3CFCC; 
        display: flex;
        justify-content: center;
        align-items: center;

    }

       .right-section {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 1em;
        padding: 1em;
        background: #d013bd; /* light grey */
        justify-content: center;
        align-items: center;
    }

        .item {
            background: #FFFFFF; 
            width: 100%;
            height: 1000px;
        
        }

    </style>
    <div class="main">
        <section class="left-section"></section>
        <section class="right-section">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </section>
        
    </div>
</body>

</html>
